<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal Muscu</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#0f172a">
</head>
<body>

  <div id="view-connect" class="view">
    <h1>Journal Muscu</h1>
    <p id="status">Chargement…</p>
    <button id="btn-connect" class="btn-primary" disabled>Se connecter avec Google</button>
  </div>

  <div id="view-accueil" class="view" hidden>
    <h1>Journal Muscu</h1>
    <div id="derniere-seance-resume"></div>
    <button id="btn-demarrer" class="btn-primary"></button>
  </div>

  <div id="view-seance" class="view" hidden>
    <header class="seance-header">
      <h1 id="seance-titre"></h1>
      <button id="btn-terminer-seance">Terminer</button>
    </header>
    <p id="echauffement-rappel" class="echauffement"></p>
    <div id="blocs-container"></div>
  </div>
  <div id="rest-timer" class="rest-timer" hidden></div>

  <div id="view-fin" class="view" hidden>
    <h1>Fin de séance</h1>
    <textarea id="commentaire-seance" placeholder="Commentaire de séance…"></textarea>
    <div id="tags-container" class="tags-container"></div>
    <button id="btn-valider-archiver" class="btn-primary">Valider et archiver</button>
    <p id="resume-preview"></p>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="drive.js"></script>
  <script src="store.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
