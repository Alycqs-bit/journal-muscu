<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal Muscu</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#0f172a">
</head>
<body>

  <div id="debug-error"></div>
  <script>
    function showDebugError(msg) {
      var el = document.getElementById("debug-error");
      el.textContent = msg;
      el.style.display = "block";
    }
    window.onerror = function (msg, src, line) {
      showDebugError("Erreur JS : " + msg + " @ " + (src || "").split("/").pop() + ":" + line);
    };
    window.addEventListener("unhandledrejection", function (ev) {
      showDebugError("Erreur (promise) : " + (ev.reason && ev.reason.message ? ev.reason.message : ev.reason));
    });
  </script>

  <div id="repos-bar" class="repos-bar idle" style="display:none">
    <div class="repos-info"><span id="repos-temps"></span><span id="repos-sub"></span></div>
    <button id="repos-btn"></button>
  </div>

  <main id="app"><p class="muted">Chargement…</p></main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="data.js"></script>
  <script src="historique.js"></script>
  <script src="store.js"></script>
  <script src="timer.js"></script>
  <script src="drive.js"></script>
  <script src="resume.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
